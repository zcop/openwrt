name: Build Custom Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Detect Configurations
    runs-on: ubuntu-22.04
    outputs:
      matrix-configs: ${{ steps.set-matrix.outputs.configs }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Matrix List
        id: set-matrix
        run: |
          cd configs
          # Find all *.config files, strip leading ./ and trailing .config, and output as JSON array
          CONFIGS_JSON=$(find . -name "*.config" | sed 's|^\./||' | sed 's/\.config$//' | jq -R -s -c 'split("\n")[:-1]')
          echo "Discovered configs: $CONFIGS_JSON"
          echo "configs=$CONFIGS_JSON" >> $GITHUB_OUTPUT

  build-firmware:
    name: Build (${{ matrix.config }})
    needs: setup-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup-matrix.outputs.matrix-configs) }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Cache downloads (dl)
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ matrix.config }}-${{ hashFiles('include/target.mk', 'package/libs/toolchain/Makefile') }}
          restore-keys: |
            dl-${{ matrix.config }}-
            dl-

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Device Configuration
        run: |
          cp configs/${{ matrix.config }}.config .config
          make defconfig

      - name: Download Package Sources
        run: |
          make download

      - name: Build Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.config }}
          path: bin/targets/
